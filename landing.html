<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>부산 누누하우스 풀빌라 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/landing.css" />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="부산 누누하우스 풀빌라 펜션" />
  <meta property="og:description" content="자연이 살아숨쉬는 힐링스테이, 부산 누누하우스 풀빌라 입니다. 객실에서 바다를 감상할 수 있으며 감성적인 인테리어가 힐링을 더해줍니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/14/AndmY9QZGg8X.jpg" />
  <meta property="og:url" content="https://nunuhouse.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="부산 누누하우스 풀빌라 펜션" />
  <meta name="twitter:description" content="자연이 살아숨쉬는 힐링스테이, 부산 누누하우스 풀빌라 입니다. 객실에서 바다를 감상할 수 있으며 감성적인 인테리어가 힐링을 더해줍니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/14/AndmY9QZGg8X.jpg" />
  <meta name="naver-site-verification" content="d55d505d9a821c531edc3e546d6badd90c17d1df" />
  <meta name="google-site-verification" content="oVLybMi3s4l-qn7_uepgoOFEHWF7le3XN85E7zdXaiU" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <!-- 랜딩 게이트: 헤더/푸터 없음 — 숙소를 아직 고르기 전 화면이라
         특정 숙소의 내비게이션(ABOUT/ROOMS/SPECIAL 등)을 보여줄 수 없다.
         himongpoolvilla.kr(3카드) / haimom(2카드) 형태의 "여러 숙소 게이트" 참고. -->
    <div id="landing-gate">
      <!-- data-* 속성 : data-landing-cards (동적 매핑, li 개수 = 카드 수)
           pages.landing.sections[0].about[] -->
      <ul class="landing_cards" data-landing-cards>
        <!-- MAPPER: about[i] → li.landing_card > a > div.landing_card_bg + div.landing_card_overlay + div.landing_card_content -->
      </ul>
    </div>

    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/landing-mapper.js"></script>
    <script src="js/pages/landing.js"></script>
  </body>
</html>
